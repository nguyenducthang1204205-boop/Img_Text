name = "img-text"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Trang web tĩnh trong public/. Các đường dẫn dưới đây đi qua Worker trước
# (API đăng nhập, trang chủ, và kiểm tra đăng nhập cho /app/)
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/", "/app", "/app/*", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "duc-thang-db"
# ID của cơ sở dữ liệu D1 "duc-thang-db" trên Cloudflare
database_id = "f3186e0d-55d5-4860-b171-209e161329c3"
migrations_dir = "migrations"
